version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smr-postgres
    environment:
      POSTGRES_DB: smr_mirroring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smr_mirroring"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: smr-coturn
    network_mode: "host"
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  server:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: smr-signaling-server
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smr_mirroring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_key_minimum_32_chars_long_production
      TURN_SHARED_SECRET: coturn_shared_secret_key_for_hmac_auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
