# Coturn Server Configuration for WebRTC Media Relay
listening-port=3478
tls-listening-port=5349
realm=smr.mirroring.internal

# Ephemeral REST API HMAC Authentication
use-auth-secret
static-auth-secret=coturn_shared_secret_key_for_hmac_auth

# Security Hardening
no-stdout-log
log-file=/var/log/turnserver.log
fingerprint
lt-cred-mech
no-multicast-peers
stale-nonce=600
